# nginx site for the Notion Sample Tracker (template: change the names and certificate paths).
# Install as /etc/nginx/conf.d/sampletracker.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# The app listens on 127.0.0.1:8000 only (GUNICORN_BIND), so nginx is the only way in.

server {
    listen 80;
    server_name sampletracker.example.utk.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sampletracker.example.utk.edu;

    ssl_certificate     /etc/ssl/sampletracker/fullchain.pem;
    ssl_certificate_key /etc/ssl/sampletracker/privkey.pem;

    # Sample forms post photos in one request (up to MAX_UPLOAD_MB, default 200). Result files are sent in
    # UPLOAD_CHUNK_MB pieces, so this one value covers both. Keep request buffering on (the default): the app
    # needs a Content-Length on every upload chunk.
    client_max_body_size 200m;
    client_body_timeout 120s;

    # ------------------------------------------------------------------------------------------------
    # YOUR LOGIN GOES HERE (SSO module, auth_request, auth_basic, ...).
    # It must protect every location below, including /files/. Then set ACCESS_BEHIND_AUTH_PROXY=true.
    # (The app's /healthz endpoint is harmless to leave open if a monitoring tool needs it.)
    # ------------------------------------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Large downloads are streamed through without nginx writing temporary copies.
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
